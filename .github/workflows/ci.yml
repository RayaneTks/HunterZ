name: HUNT CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: hunt-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Typecheck and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Require player-readable release notes on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          message="$(git show -s --format=%B HEAD)"
          if ! grep -q '^Release-Title: .\+' <<< "$message"; then
            echo 'Add a Release-Title trailer with a player-friendly title.' >&2
            exit 1
          fi
          if ! grep -q '^Release-Note: .\+' <<< "$message"; then
            echo 'Add at least one Release-Note trailer describing a concrete change for players.' >&2
            exit 1
          fi
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key

  e2e:
    name: Mobile lobby end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
